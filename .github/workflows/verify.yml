name: verify

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: genvm-lint check contracts/SemanticResourceMutex.py --json
      - run: genvm-lint typecheck contracts/SemanticResourceMutex.py --strict
        env:
          PYTHONIOENCODING: utf-8
      - run: python -m pytest tests/direct -q
      - run: node --check deploy/001_deploy.js
